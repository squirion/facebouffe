name: Release

# Web (PWA) deploys to GitHub Pages on every push to main.
# A version tag (v1.2.3) additionally publishes a signed APK to a Release.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: write   # create the GitHub Release
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Web → GitHub Pages (main / manual) ----
  web:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web (PWA)
        run: flutter build web --release --base-href /facebouffe/
      - name: Write version.json
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          cat > build/web/version.json <<EOF
          { "version": "${VER%%+*}", "build": ${VER##*+}, "apk": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/facebouffe.apk" }
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: web
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---- Signed APK → GitHub Release (tags only) ----
  apk:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/facebouffe-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          storeFile=facebouffe-release.jks
          EOF
      - name: Build Android APK (ARM 32/64-bit, signed)
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/facebouffe.apk
      - name: Publish GitHub Release (APK)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/facebouffe.apk
          generate_release_notes: true
