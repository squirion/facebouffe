name: Release

# Ship web + Android together on a version tag, e.g. `git tag v1.0.0 && git push --tags`.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write   # create the GitHub Release
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/facebouffe-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          storeFile=facebouffe-release.jks
          EOF

      - name: Build Android APK (universal, signed)
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/facebouffe.apk

      - name: Build web (PWA)
        run: flutter build web --release --base-href /facebouffe/

      - name: Write version.json
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          NAME=${VER%%+*}
          BUILD=${VER##*+}
          cat > build/web/version.json <<EOF
          {
            "version": "$NAME",
            "build": $BUILD,
            "tag": "${GITHUB_REF_NAME}",
            "apk": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/facebouffe.apk"
          }
          EOF
          cp build/web/version.json dist/version.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publish GitHub Release (APK)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/facebouffe.apk
          generate_release_notes: true

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
