<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebouffe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #e7ddcd; }
    body { font-family: "Hanken Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    #root { height: 100%; }
    .fb-scroll, .fb-hscroll { scrollbar-width: none; -ms-overflow-style: none; }
    .fb-scroll::-webkit-scrollbar, .fb-hscroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
    button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
    input, textarea, select { font-family: inherit; }
    input::placeholder, textarea::placeholder { color: #b3a99b; opacity: 1; }

    /* Motion — transform/opacity only; gated by reduce-motion in JS */
    @keyframes fbSlideFromRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes fbSlideFromLeft { from { transform: translateX(-26%); opacity: 0.55; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fbFadeThrough { from { opacity: 0; transform: translateY(9px) scale(0.992); } to { opacity: 1; transform: none; } }
    @keyframes fbFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fbPop { 0% { transform: scale(1); } 38% { transform: scale(1.32); } 70% { transform: scale(0.92); } 100% { transform: scale(1); } }
    @keyframes fbRowIn { from { opacity: 0; transform: translateY(-7px); } to { opacity: 1; transform: none; } }
    .fb-row-in { animation: fbRowIn 220ms cubic-bezier(0.4,0,0.2,1) both; }
    @keyframes fbSheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes fbSpin { to { transform: rotate(360deg); } }
    .fb-spin { animation: fbSpin 0.8s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Plain JS (run immediately, before Babel transpiles) -->
  <script src="fb-core.js"></script>
  <script src="frames/image-slot.js"></script>

  <!-- Components + screens (Babel) -->
  <script type="text/babel" src="frames/ios-frame.jsx"></script>
  <script type="text/babel" src="frames/android-frame.jsx"></script>
  <script type="text/babel" src="frames/tweaks-panel.jsx"></script>
  <script type="text/babel" src="fb-ui.jsx"></script>
  <script type="text/babel" src="fb-nutrition.jsx"></script>
  <script type="text/babel" src="fb-import.jsx"></script>
  <script type="text/babel" src="fb-social.jsx"></script>
  <script type="text/babel" src="fb-screens-home.jsx"></script>
  <script type="text/babel" src="fb-screens-recipe.jsx"></script>
  <script type="text/babel" src="fb-screens-misc.jsx"></script>
  <script type="text/babel" src="fb-tablet.jsx"></script>
  <script type="text/babel" src="fb-app.jsx"></script>

  <style id="__om-edit-overrides"></style>
</body>
</html>
